<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<meta name="color-scheme" content="dark">
<title>Aurora</title>
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --night: #02060a;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: var(--night); overflow: hidden; }
  body { height: 100%; }
  #sky { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  /* only shown if WebGL is unavailable */
  html.no-gl body {
    background:
      radial-gradient(120% 55% at 30% 62%, rgba(20, 140, 90, .55), transparent 65%),
      radial-gradient(90% 40% at 78% 48%, rgba(70, 40, 140, .35), transparent 70%),
      linear-gradient(#02060a, #061a20 70%, #02060a);
  }
</style>
</head>
<body>
<canvas id="sky" role="img" aria-label="Animated aurora over a still lake and a night sky"></canvas>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';

  const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uLook;
uniform float uFrame;

#define PI 3.14159265

/* ---------- hashing & noise ---------- */
float hash11(float p){ p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2  hash22(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm3(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){
    s += a * vnoise(p);
    p = mat2(0.8, 0.6, -0.6, 0.8) * p * 2.03 + 7.1;
    a *= 0.5;
  }
  return s / 0.875;
}
float noise1(float x){
  float i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(hash11(i), hash11(i + 1.0), f);
}
float fbm1(float x){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ s += a * noise1(x); x = x * 2.07 + 5.3; a *= 0.5; }
  return s / 0.9375;
}

/* ---------- aurora ----------
   Each curtain is a vertical sheet standing on a wavering footprint curve
   z = f(x), leaning a little with height. Instead of blindly marching, we solve
   for the exact point where the view ray pierces each sheet (Newton), so every
   curtain keeps a razor-thin, resolution-independent lower edge. At the hit:
     - brightness grows where the ray grazes the sheet (that is what makes folds glow)
     - a ragged lower boundary, hot at the base and fading upward
     - vertical ray striations tied to world x, plus slow travelling pulses
   A few coarse slices add the faint volumetric veil around and above the sheets.
   Colour follows altitude: rose fringe -> emerald -> teal -> violet -> crimson. */
vec3 auroraPal(float k){
  vec3 c = mix(vec3(0.80, 0.10, 0.46), vec3(0.10, 1.00, 0.42), smoothstep(0.00, 0.045, k));
  c = mix(c, vec3(0.04, 0.78, 0.82), smoothstep(0.20, 0.50, k));
  c = mix(c, vec3(0.38, 0.18, 0.96), smoothstep(0.38, 0.70, k));
  c = mix(c, vec3(0.90, 0.10, 0.34), smoothstep(0.66, 0.95, k));
  return c;
}

vec2 noise1d(float x){
  float i = floor(x), f = fract(x);
  float u = f * f * (3.0 - 2.0 * f);
  float a = hash11(i), b = hash11(i + 1.0);
  return vec2(mix(a, b, u), (b - a) * 6.0 * f * (1.0 - f));
}

/* footprint curve: returns (z, dz/dx) */
vec2 curveZD(float x, float t, float z0, float amp, float seed){
  vec2 n1 = noise1d(x * 0.060 + t * 0.018 + seed);
  vec2 n2 = noise1d(x * 0.170 - t * 0.026 + seed * 2.3);
  vec2 n3 = noise1d(x * 0.420 + t * 0.050 + seed * 3.7);
  float n  = 0.66 * n1.x + 0.29 * n2.x + 0.05 * n3.x;
  float dn = 0.66 * 0.060 * n1.y + 0.29 * 0.170 * n2.y + 0.05 * 0.420 * n3.y;
  return vec2(z0 + amp * (n - 0.5) * 3.2, amp * 3.2 * dn);
}

const float LEAN = 0.27;

/* returns (intensity, altitude parameter 0..1) of the sheet along this ray */
vec2 sheetHit(vec3 rd, float t, float z0, float amp, float seed){
  float den0 = rd.z - LEAN * rd.y;
  if (den0 < 0.08 || rd.y < 0.004) return vec2(0.0);

  float d = z0 / den0;
  float den = den0;
  float F = 1.0;
  for (int j = 0; j < 8; j++){
    vec2 c = curveZD(rd.x * d, t, z0, amp, seed);
    F   = den0 * d - c.x;
    den = den0 - c.y * rd.x;
    float dd = F / (abs(den) < 0.2 ? (den < 0.0 ? -0.2 : 0.2) : den);
    d -= clamp(dd, -6.0, 6.0);
    if (d < 0.5) return vec2(0.0);
  }
  vec2 c = curveZD(rd.x * d, t, z0, amp, seed);
  F = den0 * d - c.x;
  if (abs(F) > 0.12) return vec2(0.0);                 /* did not converge: skip */
  den = den0 - c.y * rd.x;

  float x   = rd.x * d;
  float alt = rd.y * d;
  float a0  = 0.9 + 0.8 * noise1(x * 0.11 + seed * 3.1);              /* ragged lower boundary */
  float kA  = (alt - a0) / (a0 * 7.0);
  if (kA < 0.0) return vec2(0.0);

  float gate = smoothstep(0.22, 0.60, noise1(x * 0.045 + seed * 5.1 + t * 0.012));

  float u  = x * 1.15 + rd.z * d * 0.35 + t * 0.10 + seed * 13.0;
  float st = 0.30 * noise1(u * 1.3) + 0.30 * noise1(u * 3.7 + 7.0) + 0.40 * noise1(u * 10.3 + 2.0);
  float ray = mix(0.10, 1.8, smoothstep(0.30, 0.72, st));
  ray = mix(ray, 1.0, clamp(d / 70.0, 0.0, 1.0));

  float rl   = 0.55 + 1.10 * noise1(u * 0.9 + 4.0);                     /* every ray has its own length */
  float kE   = kA / rl;
  float prof = smoothstep(0.0, 0.02, kA) * exp(-kE * 4.2) + 1.6 * exp(-kA * 13.0) * smoothstep(0.0, 0.006, kA);

  float pulse = 0.66 + 0.34 * sin(x * 0.6 + rd.z * d * 0.35 - t * 0.5 + seed * 7.0);
  float graze = 0.30 / max(abs(den), 0.22);                           /* folds seen edge-on burn brighter */
  float fog   = exp(-d * 0.02);

  return vec2(prof * ray * pulse * gate * graze * fog, kA);
}

vec3 aurora(vec3 rd, float t, vec2 fc){
  float vis = smoothstep(0.0, 0.05, rd.y);
  if (vis <= 0.0) return vec3(0.0);

  vec3 acc = vec3(0.0);
  vec2 h1 = sheetHit(rd, t,  9.0, 3.6, 1.0);
  vec2 h2 = sheetHit(rd, t, 17.0, 5.0, 2.0);
  vec2 h3 = sheetHit(rd, t,  4.6, 1.6, 3.0);
  acc += auroraPal(h1.y) * h1.x * 1.20;
  acc += auroraPal(h2.y) * h2.x * 0.90;
  acc += auroraPal(h3.y) * h3.x * 0.60;

  /* volumetric veil: coarse slices, soft gaussians around each sheet */
  float ry  = max(rd.y, 0.03);
  float ign = fract(52.9829189 * fract(dot(fc, vec2(0.06711056, 0.00583715))));
  float jit = fract(ign + uFrame * 0.61803398875);
  const int N = 14;
  const float A0 = 0.9;
  const float RATIO = 8.0;
  float lnR = log(RATIO);
  vec3 veilAcc = vec3(0.0);
  for (int i = 0; i < N; i++){
    float f   = (float(i) + jit) / float(N);
    float alt = A0 * exp(f * lnR);
    float kA  = (alt - A0) / (A0 * (RATIO - 1.0));
    float d   = alt / ry;
    vec2 xz   = rd.xz * d + vec2(0.8, 1.7) * kA;
    float g1 = smoothstep(0.22, 0.60, noise1(xz.x * 0.045 + 5.1  + t * 0.012));
    float g2 = smoothstep(0.22, 0.60, noise1(xz.x * 0.045 + 10.2 + t * 0.012));
    float g3 = smoothstep(0.22, 0.60, noise1(xz.x * 0.045 + 15.3 + t * 0.012));
    float e1 = xz.y - curveZD(xz.x, t,  9.0, 3.6, 1.0).x;
    float e2 = xz.y - curveZD(xz.x, t, 17.0, 5.0, 2.0).x;
    float e3 = xz.y - curveZD(xz.x, t,  4.6, 1.6, 3.0).x;
    float soft = g1 * exp(-e1 * e1 / 5.0) + 0.6 * g2 * exp(-e2 * e2 / 9.0) + 0.7 * g3 * exp(-e3 * e3 / 3.0);
    float veil = 0.25 + 1.4 * smoothstep(0.25, 0.85, kA);
    veilAcc += auroraPal(kA) * soft * veil * exp(-d * 0.026);
  }
  acc += veilAcc * (0.075 * 48.0 / float(N)) * 0.35;

  float gain = 0.90 + 0.22 * sin(t * 0.08) + 0.08 * sin(t * 0.21 + 2.0);
  return acc * gain * vis;
}

/* ---------- stars & meteor ---------- */
vec3 starLayer(vec2 s, float scale, float thr, float t, float seed){
  vec2 g  = s * scale;
  vec2 id = floor(g);
  vec2 f  = fract(g);
  float h = hash21(id + seed);
  if (h < thr) return vec3(0.0);
  vec2  o  = 0.2 + 0.6 * hash22(id + seed * 1.7);
  float d  = length(f - o);
  float sz = 0.06 + 0.10 * hash21(id * 1.3 + seed);
  float core = 1.0 - smoothstep(0.0, sz, d);
  core *= core;
  float br = 0.35 + 0.65 * pow(hash21(id + seed + 9.0), 2.0);
  float tw = 0.75 + 0.25 * sin(t * (1.2 + 3.0 * hash21(id + 4.0)) + h * 60.0);
  vec3 tint = mix(vec3(0.75, 0.85, 1.00), vec3(1.00, 0.88, 0.72), hash21(id + 3.3));
  return tint * core * br * tw * 1.5;
}

float meteor(vec2 s, float t){
  float period = 19.0;
  float cyc = t / period;
  float id  = floor(cyc);
  float ph  = fract(cyc) * period / 1.1;
  if (ph > 1.0) return 0.0;
  vec2 st = vec2(mix(-0.35, 0.35, hash11(id * 3.1)), mix(0.22, 0.42, hash11(id * 7.7)));
  float sgn = hash11(id * 9.1) > 0.5 ? 1.0 : -1.0;
  vec2 dir = normalize(vec2(mix(0.6, 1.0, hash11(id * 5.3)) * sgn, -0.35));
  vec2 head = st + dir * 0.22 * ph;
  vec2 tail = head - dir * 0.09 * sin(ph * PI);
  vec2 pa = s - tail, ba = head - tail;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  float d = length(pa - ba * h);
  return (1.0 - smoothstep(0.0, 0.0012, d)) * h * sin(ph * PI);
}

/* ---------- the sky itself ---------- */
vec3 skyScene(vec3 rd, float t, vec2 fc, out vec3 aur){
  float e = max(rd.y, 0.0);
  vec2  s = vec2(atan(rd.x, rd.z), rd.y);

  vec3 sky = mix(vec3(0.014, 0.046, 0.062), vec3(0.005, 0.010, 0.032), smoothstep(0.0, 0.50, e));
  sky += vec3(0.010, 0.045, 0.030) * exp(-e * 9.0);                    /* airglow at the horizon */

  float band = dot(rd, normalize(vec3(0.72, -0.52, 0.10))) + 0.02;    /* milky way, faint */
  float mwm  = exp(-band * band / 0.022);
  float dust = fbm3(s * 5.0 + 3.7);
  float lane = smoothstep(0.45, 0.70, fbm3(s * 11.0 + 40.0));
  float mw   = mwm * (0.35 + 0.9 * smoothstep(0.25, 0.75, dust)) * (1.0 - 0.6 * lane);
  sky += mw * 0.8 * mix(vec3(0.045, 0.055, 0.095), vec3(0.090, 0.075, 0.070), dust);

  aur = aurora(rd, t, fc);
  float lum = dot(aur, vec3(0.30, 0.55, 0.15));

  vec3 stars = starLayer(s,  62.0, 0.955, t, 1.0)
             + starLayer(s, 135.0, 0.965, t, 2.0) * 0.80
             + starLayer(s, 270.0, 0.975, t, 3.0) * 0.55;
  stars += vec3(0.90, 0.97, 1.00) * meteor(s, t) * 1.6;
  stars *= smoothstep(0.0, 0.10, e) * (1.0 - clamp(lum * 1.8, 0.0, 0.92));

  return sky + aur + stars;
}

/* ---------- land ---------- */
float ridgeFar(float a){
  float n = fbm1(a * 3.6 + 3.7);
  float r = 1.0 - abs(2.0 * n - 1.0);
  float big = fbm1(a * 1.1 + 9.0);
  return 0.014 + 0.11 * pow(r, 1.7) * (0.35 + 0.9 * big);
}

float ridgeVeryFar(float a){
  float n = fbm1(a * 2.4 + 60.0);
  return 0.020 + 0.075 * pow(1.0 - abs(2.0 * n - 1.0), 1.5);
}

float ridgeNear(float a){
  float base = 0.004 + 0.022 * fbm1(a * 2.2 + 21.0);
  float edge = smoothstep(0.30, 0.85, abs(a));
  base += 0.10 * edge;                                                 /* banks rise at the frame edges */
  float u = a * 85.0;
  float cell = floor(u), f = fract(u);
  float hh  = hash11(cell * 1.73 + 3.1);
  float tri = 1.0 - abs(f - 0.5) * 2.0;
  float stand = smoothstep(0.30, 0.60, fbm1(a * 5.0 + 50.0));
  float tree = pow(tri, 1.35) * (0.45 + 0.85 * hh) * 0.020 * stand;
  return base + tree * (1.0 + 2.2 * edge);
}

void main(){
  vec2  fc = gl_FragCoord.xy;
  vec2  p  = (fc - 0.5 * uRes) / uRes.y;
  float t  = uTime;

  float pitch = 0.20 + uLook.y * 0.035;
  vec3  rd = normalize(vec3(p.x + uLook.x * 0.12, p.y + pitch, 1.35));

  /* the lake: mirror the view ray, shake it row by row */
  bool  water = rd.y < 0.0;
  vec3  r = rd;
  float dep0 = max(-rd.y, 0.0);
  if (water){
    float row  = vnoise(vec2(rd.y * 150.0 - t * 0.30, 1.7)) - 0.5;
    float row2 = vnoise(vec2(rd.y *  90.0 + t * 0.12, rd.x * 6.0 + 8.0)) - 0.5;
    float amp  = smoothstep(0.0, 0.07, dep0);
    r = normalize(vec3(rd.x + (row * 0.005 + row2 * 0.010) * amp, -rd.y + row2 * 0.004 * amp, rd.z));
  }

  vec3 aur;
  vec3 col = skyScene(r, t, fc, aur);

  float a  = atan(r.x, r.z);
  float b  = r.y;
  float px = 1.6 / (uRes.y * 1.35);
  float aurL = dot(aur, vec3(0.30, 0.55, 0.15));

  /* distant range: mostly haze */
  float hV   = ridgeVeryFar(a * 0.9 + 2.0 + uLook.x * 0.006);
  float visV = smoothstep(hV - px, hV + px, b);
  vec3  farV = mix(vec3(0.012, 0.030, 0.042), vec3(0.045, 0.120, 0.120), exp(-b * 18.0)) + aur * 0.28;
  col = mix(farV, col, visV);

  /* far ridge: hazy, snow-rimmed by the aurora */
  float hF   = ridgeFar(a + uLook.x * 0.012);
  float visF = smoothstep(hF - px, hF + px, b);
  vec3  farC = mix(vec3(0.006, 0.016, 0.024), vec3(0.030, 0.090, 0.090), exp(-b * 26.0));
  farC += aur * 0.16;
  farC += vec3(0.10, 0.30, 0.28) * (1.0 - smoothstep(0.0, 0.012, hF - b)) * (0.05 + aurL * 1.4);
  col = mix(farC, col, visF);

  /* near shore: pines, black */
  float hN   = ridgeNear(a - uLook.x * 0.020);
  float visN = smoothstep(hN - px, hN + px, b);
  vec3  nearC = vec3(0.002, 0.005, 0.007) + vec3(0.010, 0.030, 0.030) * exp(-b * 40.0);
  col = mix(nearC, col, visN);

  /* water tint */
  float aS = atan(rd.x, rd.z);
  if (water){
    float dep = smoothstep(0.0, 0.24, dep0);
    col *= mix(vec3(0.80, 0.92, 1.00) * 0.85, vec3(0.42, 0.62, 0.72) * 0.55, dep);
    col += vec3(0.020, 0.050, 0.050) * vnoise(vec2(aS * 30.0, rd.y * 500.0 - t * 0.4)) * dep * 0.4;
  }

  /* aurora fog: mist lying along the horizon, lit from above */
  float bs   = rd.y;
  float env  = exp(-abs(bs) * (bs > 0.0 ? 32.0 : 20.0));
  float m1   = fbm3(vec2(aS * 7.0 + t * 0.012, bs * 38.0));
  float m2   = fbm3(vec2(aS * 15.0 - t * 0.020 + 9.0, bs * 70.0 + 3.0));
  float mist = env * smoothstep(0.25, 0.85, m1 * 0.6 + m2 * 0.5);
  vec3  glow = mix(vec3(0.03, 0.10, 0.12), vec3(0.10, 0.50, 0.34),
                   smoothstep(0.2, 0.8, fbm3(vec2(aS * 2.2 + t * 0.02, 4.7))));
  col = mix(col, glow * 0.35 + aur * 0.10, clamp(mist * 0.85, 0.0, 0.6));

  /* finish */
  col = 1.0 - exp(-col * 1.6);
  col = pow(col, vec3(0.92));
  vec2 v = p * vec2(0.9, 1.1);
  col *= 1.0 - 0.45 * dot(v, v);
  col += (hash21(fc + fract(t) * 100.0) - 0.5) * (1.5 / 255.0);

  gl_FragColor = vec4(col, 1.0);
}

`;

  let gl = null, program = null, U = {};
  let raf = 0, frame = 0;
  let time = 40;                       // start mid-evolution so the first frame is already dramatic
  let last = performance.now();
  let ema = 16, scale = 1;
  const dprCap = Math.min(window.devicePixelRatio || 1, 1.5);
  const look = { x: 0, y: 0, tx: 0, ty: 0 };

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  function init() {
    gl = canvas.getContext('webgl', {
      antialias: false, alpha: false, depth: false, stencil: false,
      powerPreference: 'high-performance'
    });
    if (!gl) return false;

    const vs = compile(gl.VERTEX_SHADER, VERT);
    const fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;

    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
      return false;
    }
    gl.useProgram(program);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    U = {
      res:   gl.getUniformLocation(program, 'uRes'),
      time:  gl.getUniformLocation(program, 'uTime'),
      look:  gl.getUniformLocation(program, 'uLook'),
      frame: gl.getUniformLocation(program, 'uFrame')
    };
    resize();
    return true;
  }

  function resize() {
    if (!gl) return;
    const w = Math.max(2, Math.round(canvas.clientWidth  * dprCap * scale));
    const h = Math.max(2, Math.round(canvas.clientHeight * dprCap * scale));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function draw(now) {
    raf = requestAnimationFrame(draw);
    const dt = now - last; last = now;

    // step quality down on slow GPUs (ignore stalls from tab switches)
    if (dt < 250) ema += (dt - ema) * 0.05;
    if (++frame % 60 === 0 && ema > 26 && scale > 0.5) {
      scale = Math.max(0.5, scale * 0.82);
      resize();
      ema = 16;
    }

    time += Math.min(dt, 100) / 1000 * (reduceMotion ? 0.12 : 1);

    // gentle idle drift + pointer parallax
    look.x += (look.tx - look.x) * 0.04;
    look.y += (look.ty - look.y) * 0.04;
    const drift = reduceMotion ? 0 : 1;
    const lx = look.x + Math.sin(time * 0.045) * 0.55 * drift;
    const ly = look.y + Math.sin(time * 0.031 + 1.0) * 0.35 * drift;

    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform1f(U.time, time);
    gl.uniform2f(U.look, lx, ly);
    gl.uniform1f(U.frame, frame % 1024);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function start() {
    cancelAnimationFrame(raf);
    last = performance.now();
    raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', (e) => {
    look.tx =  (e.clientX / window.innerWidth  - 0.5) * 2;
    look.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); cancelAnimationFrame(raf); });
  canvas.addEventListener('webglcontextrestored', () => { if (init()) start(); });

  if (init()) start();
  else document.documentElement.classList.add('no-gl');
})();
</script>
</body>
</html>
